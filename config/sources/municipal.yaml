  #         itemSelector 代替候補: '#contents a' / '.news-list a'
  # ---------------------------------------------------------------------------
  - id: mu_city_kawasaki
    name: 川崎市 健康福祉局 障害保健福祉部(事業者向け)
    type: html
    url: https://www.city.kawasaki.jp/350/index.html
