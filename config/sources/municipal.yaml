  # 指定・指導権限を持つため、政令市に準じて初期リリースに含める(冒頭コメント参照)。
  # 要検証: URL。横須賀市は /<4桁数字>/ の部課ディレクトリを使う。
  #         3050 が障害福祉課でない場合は https://www.city.yokosuka.kanagawa.jp/ の
  #         組織一覧から障害福祉担当課を辿って差し替えること。
  #         itemSelector 代替候補: '#contents a' / '.news-list a'
  # ---------------------------------------------------------------------------
  - id: mu_city_yokosuka
    name: 横須賀市 福祉部 障害福祉課(事業者向け)
    type: html
    url: https://www.city.yokosuka.kanagawa.jp/3050/index.html
    channels: [welfare]
    priority: medium
    region: 神奈川県(横須賀市)
    enabled: true
    html:
      itemSelector: 'main a'
      dateSelector: null
      includeUrlPatterns: ['city.yokosuka.kanagawa.jp/3050/', 'city.yokosuka.kanagawa.jp/g_images/']
      excludeUrlPatterns:
