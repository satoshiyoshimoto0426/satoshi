# =============================================================================
# M3-09(中核市 追加分)で登録する自治体の一覧
# 要件定義書 §5.4 の表のうち、初期リリースに含めなかった中核市。
# 追加はこのファイルに 1 ブロック追記するだけでよい(FR-01 / NFR-05)。
# id は mu_city_<ローマ字> とし、region は「<都府県名>(<市名>)」形式を守ること。
#
#   愛知県: 豊橋市(mu_city_toyohashi)、岡崎市(mu_city_okazaki)、
#           豊田市(mu_city_toyota)、一宮市(mu_city_ichinomiya)
#   大阪府: 豊中市(mu_city_toyonaka)、高槻市(mu_city_takatsuki)、
#           枚方市(mu_city_hirakata)、八尾市(mu_city_yao)、
#           寝屋川市(mu_city_neyagawa)、東大阪市(mu_city_higashiosaka)、
#           吹田市(mu_city_suita)
#   兵庫県: 姫路市(mu_city_himeji)、尼崎市(mu_city_amagasaki)、
#           明石市(mu_city_akashi)、西宮市(mu_city_nishinomiya)
#   福岡県: 久留米市(mu_city_kurume)
#
# 注: 八王子市(東京都)と横須賀市(神奈川県)は §5.4 の表では中核市だが、
#     上記の理由で初期リリースに前倒しして本ファイルへ登録済みのため、
#     M3-09 で重複登録しないこと(id 重複は起動時に ConfigError になる)。
# =============================================================================
