      dateSelector: null
      includeUrlPatterns: ['city.sagamihara.kanagawa.jp/jigyosha/', 'city.sagamihara.kanagawa.jp/_res/']
      excludeUrlPatterns:
        [
          'javascript:',
          'mailto:',
          '.css',
          '#',
          '.pdf#',
          'twitter.com',
          'facebook.com',
          'line.me',
          'youtube.com',
          'instagram.com',
        ]
    note: 相模原市の障害福祉サービス事業者向け通知。指定基準・市独自加算・集団指導の変更を検知する。

  # ---------------------------------------------------------------------------
