# =============================================================================
# 報道・集約サイト(2 次情報)
# id 接頭辞: news_
#
# なぜ 2 次情報を入れるか:
#   官公庁サイトの直接監視は、URL が年度で変わり、HTML 構造も予告なく変わり、
#   ボット拒否も多い。初回の verify-sources では 45 件中ほとんどが 404 / 403 /
#   セレクタ不一致で使えなかった。1 次情報だけに頼ると「取りこぼしたことにすら
#   気づけない」状態になる。
#
#   制度改正は必ず報道される。報道を併走させれば、官公庁ページの構造変化で
#   1 次情報を取り逃しても、改正があったこと自体は掴める。
#
# 位置づけ(ここを取り違えないこと):
#   報道は「気づくため」の網であって、根拠ではない。事業所が実際に従うのは
#   告示・通知そのものである。配信文の注意書きに報道を含む旨を明記している。
#
# 技術的な利点:
#   すべて RSS なので CSS セレクタが要らない。セレクタ失効という
#   「巡回は成功しているのに永久に 0 件」の故障モードが原理的に起きない。
#
# 追加するときは必ず verify-sources で到達確認すること。
# 特に robots.txt での拒否は珍しくない(本システムは robots.txt を必ず守る。NFR-07)。
# =============================================================================
sources:
  # ---------------------------------------------------------------------------
  # Google ニュース検索の RSS は使えない(2026-09-15 実測)。
  #
  #   https://news.google.com/rss/search?... は robots.txt で拒否される。
  #
  # キーワードごとにフィードを作れるため一見最適だが、本システムは
  # robots.txt を必ず守るので取得しない。再試行しても結果は変わらない。
  # ここに再び追加しないこと。
  #
  # キーワード指定の網が要る場合は、robots.txt が許可している配信元
  # (業界紙のカテゴリ別フィードなど)で代替する。
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # 業界専門紙。一般紙より制度の細部まで踏み込むため精度が高い。
  # 到達確認済み(2026-09-15): いずれも HTTP 200。
  # ---------------------------------------------------------------------------
  - id: news_joint_kaigo
    name: '報道: 介護ニュース Joint(厚労省通知・報酬改定)'
    type: rss
    url: https://www.joint-kaigo.com/feed/
    channels: [welfare]
    priority: medium
    region: null
    enabled: true
    note: 介護中心だが障害福祉の報酬改定・通知も扱う。厚労省通知の解説が早い。

  - id: news_fukushi_shimbun
    name: '報道: 福祉新聞'
    type: rss
    url: https://fukushishimbun.co.jp/feed
    channels: [welfare]
    priority: medium
    region: null
    enabled: true
    note: 障害福祉分野の専門紙。制度改正の背景まで報じる。

  # ---------------------------------------------------------------------------
  # WAM NET(独立行政法人 福祉医療機構)。都道府県の福祉行政情報を集約している。
  # 報道より確度が高い準 1 次情報で、相手は情報提供を目的とする公的機関。
  #
  # 実測(2026-09-15)で分かったこと:
  #   - 新着フィード wamnet_news_rss2.xml は中身が空(264 バイト、項目 0 件)。
  #     死んだフィードなので設定から外した。
  #   - 都道府県フィードは「RSS」と名乗るが独自スキーマ。ルートが <RSS_LIST>、
  #     項目が大文字の <ITEM>、リンクが <URL>、日付が <DATE>。
  #     src/fetchers/rss.ts を綴りの違いに対応させて読めるようにした。
  # ---------------------------------------------------------------------------
  - id: news_wam_pref
    name: WAM NET 都道府県の福祉行政情報(全国版)
    type: rss
    url: https://www.wam.go.jp/content/wamnet/pcpub/top/wamnetlab/pref_rss/rss_all_new.xml
    channels: [welfare]
    priority: high
    region: null
    enabled: false
    note: >-
      全国 47 都道府県・全分野が 1 本に入った約 1MB のフィード。解析はできるが、
      1 ソース 50 件の上限に対して件数が多すぎ、先頭から 50 件取ると特定の県に
      偏って対象 7 府県を取りこぼす。都道府県別フィードに差し替えるまで無効。

  - id: news_rodo
    name: '報道: 労働新聞社(雇用保険・助成金・労働法制)'
    type: rss
    url: https://www.rodo.co.jp/feed/
    channels: [ai_reskill]
    priority: high
    region: null
    enabled: true
    note: 人材開発支援助成金・教育訓練給付の要件変更は申請期限に直結するため優先度を高くしている。

  # ---------------------------------------------------------------------------
  # Yahoo! ニュース(国内)。分野を限らない広い網。
  #
  # 単体では雑音が多いが、大きな制度改正は必ずここに出るため「取りこぼしに
  # 気づけない」状態を防ぐ最後の保険として入れている。
  # 雑音が配信に溢れる心配は要らない: 分類で対象外を落とし、AI に渡すのは
  # 重要度上位 20 件まで、配信はチャネルの maxItems までに絞られる。
  # 到達確認済み(2026-09-15): HTTP 200。
  # ---------------------------------------------------------------------------
  - id: news_yahoo_domestic
    name: '報道: Yahoo! ニュース(国内)'
    type: rss
    url: https://news.yahoo.co.jp/rss/topics/domestic.xml
    channels: [ai_reskill, welfare]
    priority: low
    region: null
    enabled: true
    note: 広い網。優先度を low にしているのは、専門紙と競合したときに専門紙を優先させるため。
