# =============================================================================
# 報道・集約サイト(2 次情報)
# id 接頭辞: news_
#
# なぜ 2 次情報を入れるか:
#   官公庁サイトの直接監視は、URL が年度で変わり、HTML 構造も予告なく変わり、
#   ボット拒否も多い。初回の verify-sources では 45 件中ほとんどが 404 / 403 /
#   セレクタ不一致で使えなかった。1 次情報だけに頼ると「取りこぼしたことにすら
#   気づけない」状態になる。
#
#   制度改正は必ず報道される。報道を併走させれば、官公庁ページの構造変化で
#   1 次情報を取り逃しても、改正があったこと自体は掴める。
#
# 位置づけ(ここを取り違えないこと):
#   報道は「気づくため」の網であって、根拠ではない。事業所が実際に従うのは
#   告示・通知そのものである。配信文の注意書きに報道を含む旨を明記している。
#
# 技術的な利点:
#   すべて RSS なので CSS セレクタが要らない。セレクタ失効という
#   「巡回は成功しているのに永久に 0 件」の故障モードが原理的に起きない。
#
# !!! 未検証 !!!
#   本ファイルの URL は到達確認をしていない。特に robots.txt で拒否される
#   可能性がある(本システムは robots.txt を必ず守る。NFR-07)。
#   `pnpm cli verify-sources` で確認し、NG のものは無効化すること。
# =============================================================================
sources:
  # ---------------------------------------------------------------------------
  # Google ニュース検索の RSS。キーワードごとにフィードを作れる。
  # 形式: https://news.google.com/rss/search?hl=ja&gl=JP&ceid=JP:ja&q=<URLエンコード語>
  #
  # 検索語は「制度名 + 改正を示す語」に絞っている。制度名だけだと求人広告や
  # 事業所紹介記事が大量に混ざり、AI の分類に無駄な費用がかかるため。
  # なお分類段階で対象外は落とすので、多少の雑音は最終的な配信には出ない。
  # ---------------------------------------------------------------------------
  - id: news_google_shogai_hoshu
    name: "報道: 障害福祉サービス 報酬改定(Google ニュース)"
    type: rss
