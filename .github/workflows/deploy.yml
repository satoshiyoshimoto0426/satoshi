# デプロイ(タスク M0-03 / M1-10 / M2-08)
#
# main への push で自動的に本番へ反映する。pull request では terraform plan だけを出し、
# 適用はしない(差分を読んでからマージできるようにするため)。
#
# 認証はサービスアカウントキーではなく Workload Identity 連携を使う。
# 鍵を GitHub に置かないので、漏えい時の影響が「短命トークン 1 本」に限定される(NFR-03)。
# 初期設定は infra/bootstrap.sh が行う。
name: デプロイ

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'infra/terraform/**'
      - 'Dockerfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'infra/terraform/**'
      - 'Dockerfile'
  workflow_dispatch:
    inputs:
      skip_smoke_test:
        description: 'デプロイ後の疎通確認(ドライラン)を省略する'
        type: boolean
        default: false

# 同時に 2 つ apply が走ると tfstate が競合する。前の実行は待たせる(打ち切らない)。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity 連携に必要

jobs:
  deploy:
    name: ビルドして Google Cloud へ反映
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 設定が揃っていないリポジトリで毎回失敗させない。
    if: vars.GCP_PROJECT_ID != ''
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'asia-northeast1' }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      REPOSITORY: seido-watch

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      # --- 品質ゲート -----------------------------------------------------
      # CI と重複するが、デプロイ経路単体でも壊れたものを本番へ出さないようにする。
      - name: pnpm を用意
        uses: pnpm/action-setup@v4

      - name: Node 22 を用意
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: 依存をインストール
        run: pnpm install --frozen-lockfile

      - name: 検証(lint / typecheck / test / 設定)
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm cli validate-config
        env:
          DRY_RUN: 'true'
          STORE_KIND: memory

      # --- 認証 -----------------------------------------------------------
      - name: Google Cloud へ認証(鍵なし)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: gcloud を用意
        uses: google-github-actions/setup-gcloud@v2

      - name: Artifact Registry への docker 認証
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      # --- イメージ -------------------------------------------------------
      - name: イメージのタグを決める
        id: image
        run: |
          # コミット SHA をタグにする。どのコミットが動いているか後から必ず追える。
          TAG="${GITHUB_SHA::12}"
          URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/seido-watch:${TAG}"
          echo "uri=${URI}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Buildx を用意
        uses: docker/setup-buildx-action@v3

      # Artifact Registry のリポジトリは Terraform が作る。
      # 初回はまだ存在しないので、イメージのプッシュより先に Terraform を通す必要がある。
      # そのため Terraform は 2 段階で流す(1 回目はレジストリまで、2 回目でジョブを更新)。
      - name: Terraform を用意
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Terraform 初期化
        working-directory: infra/terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="prefix=seido-watch"

      - name: 書式と構文を検査
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform validate

      # --- pull request では差分を出すだけ --------------------------------
      - name: 差分を確認(pull request)
        if: github.event_name == 'pull_request'
        working-directory: infra/terraform
        run: |
          terraform plan -input=false -no-color \
            -var="project_id=${PROJECT_ID}" \
            -var="region=${REGION}" \
            -var="image=${{ steps.image.outputs.uri }}"

      # --- 本番反映 -------------------------------------------------------
      - name: レジストリを先に作る(初回のため)
        if: github.event_name != 'pull_request'
        working-directory: infra/terraform
        run: |
          # イメージを push する先が無いと build-push が失敗するので、
          # 依存の少ないリソースだけ先に作る。2 回目以降は変更なしで即終了する。
          terraform apply -input=false -auto-approve \
            -target=google_project_service.services \
            -target=google_artifact_registry_repository.docker \
            -var="project_id=${PROJECT_ID}" \
            -var="region=${REGION}" \
            -var="image=${{ steps.image.outputs.uri }}"

      - name: イメージをビルドして push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Terraform で反映
        if: github.event_name != 'pull_request'
        working-directory: infra/terraform
        run: |
          terraform apply -input=false -auto-approve \
            -var="project_id=${PROJECT_ID}" \
            -var="region=${REGION}" \
            -var="image=${{ steps.image.outputs.uri }}"

      # --- 反映後の確認 ---------------------------------------------------
      # 設定 YAML が読めること、LINE トークンが解決できることを、
      # 実際に配信せずに確かめる。ここで落ちれば翌朝の配信前に気づける。
      - name: 疎通確認(送信はしない)
        if: github.event_name != 'pull_request' && inputs.skip_smoke_test != true
        run: |
          gcloud run jobs execute seido-watch-deliver \
            --region "${REGION}" --project "${PROJECT_ID}" --wait \
            --args=deliver,--dry-run

      - name: 反映内容を表示
        if: github.event_name != 'pull_request'
        working-directory: infra/terraform
        run: |
          echo "### デプロイ完了" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 項目 | 値 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| イメージ | \`${{ steps.image.outputs.uri }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| コミット | ${GITHUB_SHA::12} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| プロジェクト | ${PROJECT_ID} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| リージョン | ${REGION} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "巡回 06/12/18/23 時、要約 07:00、配信 07:30(JST)で動きます。" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**本番投入が初回の場合、情報源の URL 検証がまだ済んでいません。**" >> "$GITHUB_STEP_SUMMARY"
          echo "運用手順書 §8 の \`verify-sources\` を必ず実行してください。" >> "$GITHUB_STEP_SUMMARY"
